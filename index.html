<script>
function hasNewServiceReports(reports){
  return Array.isArray(reports) && reports.some(function(r){
    return String(r && r.status || "Nové").trim() === "Nové";
  });
}
function serviceWarningHtml(reports){
  return hasNewServiceReports(reports)
    ? '<span class="service-warning-triangle" title="Nové servisní hlášení">⚠️</span>'
    : '';
}

<script>

    let currentVehicleName = "";
    function setActiveNav(active) {
      document.querySelectorAll('.bottom-nav button').forEach(function(btn) {
        btn.classList.remove('active');
      });
      const el = document.getElementById('nav' + active);
      if (el) el.classList.add('active');
    }


    function loadVehicleList() {

  const container =
    document.getElementById("vehicleList");

  if (!container) {
    return;
  }


  google.script.run

    .withSuccessHandler(function(vehicles) {

      if (!vehicles || vehicles.length === 0) {

        container.innerHTML = `
          <div class="empty-card">
            🚐 Žádná vozidla nejsou nastavena.
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      vehicles.forEach(function(vehicle, index) {

        const vehicleId =
          "vehicle-km-" + index;


        const card =
          document.createElement("div");

        card.className =
          "vehicle-card";


        const vehicleImage = vehicle.imageUrl
          ? `<img src="${vehicle.imageUrl}" alt="${vehicle.name}" loading="lazy">`
          : `<svg class="vehicle-illustration" viewBox="0 0 520 240" role="img" aria-label="Dodávka ${vehicle.name}">
              <defs><linearGradient id="vanBody${index}" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe5f1"/></linearGradient></defs>
              <ellipse cx="265" cy="207" rx="190" ry="18" fill="#cbd5e1" opacity=".55"/>
              <path d="M80 160 L92 82 Q96 57 123 52 L350 52 Q374 52 392 76 L437 127 Q446 138 447 160 L447 177 Q447 187 437 187 L102 187 Q80 187 80 160Z" fill="url(#vanBody${index})" stroke="#9aa9bb" stroke-width="4"/>
              <path d="M356 65 L386 91 L414 126 L356 126Z" fill="#b9d0e8" stroke="#8da2b8" stroke-width="3"/>
              <path d="M105 68 L337 68 L337 126 L99 126Z" fill="#cfe0ef"/>
              <rect x="112" y="130" width="214" height="39" rx="5" fill="#f4f7fa" stroke="#d1dae5" stroke-width="2"/>
              <path d="M338 130 L425 130 L438 164 L338 164Z" fill="#edf2f7" stroke="#cbd5e1" stroke-width="2"/>
              <circle cx="150" cy="187" r="29" fill="#1f2937"/><circle cx="150" cy="187" r="14" fill="#94a3b8"/>
              <circle cx="382" cy="187" r="29" fill="#1f2937"/><circle cx="382" cy="187" r="14" fill="#94a3b8"/>
              <rect x="93" y="145" width="12" height="18" rx="4" fill="#f59e0b"/><rect x="428" y="145" width="10" height="18" rx="4" fill="#ef4444"/>
              <text x="225" y="157" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#174a8b">VOLKSWAGEN</text>
            </svg>`;

        card.innerHTML = `
          <div class="vehicle-photo">${vehicleImage}</div>
          <div>
            <div class="vehicle-name">${vehicle.name}</div>
            <div class="vehicle-km-label">Poslední stav tachometru</div>
            <div class="vehicle-km" id="${vehicleId}">Načítám...</div>
          </div>
          <div class="vehicle-warning" id="${vehicleId}-warning" style="display:none;" aria-label="Upozornění">⚠️</div>
        `;

        card.onclick = function() {

          showVehicle(vehicle.name);

        };


        container.appendChild(card);


        google.script.run

          .withSuccessHandler(function(lastKm) {

            const kmElement =
              document.getElementById(vehicleId);

            if (kmElement) {

              kmElement.textContent =
                formatNumber(lastKm) + " km";

              google.script.run
                .withSuccessHandler(function(status) {
                  const warning = document.getElementById(vehicleId + "-warning");
                  if (!warning || !status) return;
                  const today = new Date();
                  today.setHours(0,0,0,0);
                  const needsAttention =
                    (status.vignetteUntil && new Date(status.vignetteUntil) < today) ||
                    (status.stkUntil && new Date(status.stkUntil) < today) ||
                    (status.oilNextKm && Number(status.oilNextKm) < Number(lastKm)) ||
                    (status.serviceNext && new Date(status.serviceNext) < today);
                  warning.style.display = needsAttention ? "block" : "none";
                })
                .withFailureHandler(function() {})
                .getTechnicalStatus(vehicle.name);

            }

          })

          .withFailureHandler(function(error) {

            const kmElement =
              document.getElementById(vehicleId);

            if (kmElement) {

              kmElement.textContent =
                "Nelze načíst";

            }

            console.error(
              "Chyba KM vozidla:",
              vehicle.name,
              error
            );

          })

          .getLastMileage(vehicle.name);

      });

    })

    .withFailureHandler(function(error) {

      container.innerHTML = `
        <div class="empty-card">
          ❌ Vozidla se nepodařilo načíst.
        </div>
      `;

      console.error(
        "Chyba při načítání vozidel:",
        error
      );

    })

    .getVehicles();

}

function setBottomNavVisible(visible) {
  const nav = document.querySelector('.bottom-nav');
  if (nav) nav.style.display = visible ? 'flex' : 'none';
}


function updateServiceNavWarning(vehicleName) {
  const navState = document.getElementById("navState");
  if (!navState || !vehicleName) return;

  google.script.run
    .withSuccessHandler(function(status) {
      if (!navState) return;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const needsAttention =
        !!(status && status.vignetteUntil && new Date(status.vignetteUntil) < today) ||
        !!(status && status.stkUntil && new Date(status.stkUntil) < today) ||
        !!(status && status.oilNextKm && status.lastKm &&
           Number(status.oilNextKm) < Number(status.lastKm)) ||
        !!(status && status.serviceNext && new Date(status.serviceNext) < today);

      navState.classList.toggle("warning-active", needsAttention);
    })
    .withFailureHandler(function() {
      if (navState) navState.classList.remove("warning-active");
    })
    .getTechnicalStatus(vehicleName);
}

function loginAdmin() {

  const password =
    document.getElementById("adminPassword").value.trim();

  const message =
    document.getElementById("adminLoginMessage");

  if (!password) {
    message.innerHTML = `
      <span style="color:#d32f2f;">
        Zadejte heslo.
      </span>
    `;
    return;
  }

  message.innerHTML = `
    <span style="color:#666;">
      ⏳ Ověřuji heslo...
    </span>
  `;

  google.script.run

    .withSuccessHandler(function(correct) {

      if (correct) {

        message.innerHTML = `
          <span style="color:#2e7d32;">
            ✅ Přihlášení úspěšné
          </span>
        `;

        setTimeout(function() {
          showAdmin();
        }, 300);

      } else {

        message.innerHTML = `
          <span style="color:#d32f2f;">
            ❌ Nesprávné heslo
          </span>
        `;

        document.getElementById("adminPassword").value = "";
        document.getElementById("adminPassword").focus();
      }

    })

    .withFailureHandler(function(error) {

      message.innerHTML = `
        <span style="color:#d32f2f;">
          ❌ ${error.message}
        </span>
      `;

    })

    .checkAdminPassword(password);
}

function loadAdminTechnicalWarning() {
  const warning = document.getElementById("adminTechnicalWarning");
  if (!warning) return;

  warning.classList.remove("show");

  google.script.run
    .withSuccessHandler(function(vehicles) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return;

      const requests = vehicles.map(function(vehicle) {
        return new Promise(function(resolve) {
          google.script.run
            .withSuccessHandler(function(status) {
              resolve(status);
            })
            .withFailureHandler(function() {
              resolve(null);
            })
            .getTechnicalStatus(vehicle.name);
        });
      });

      Promise.all(requests).then(function(statuses) {
        const hasProblem = statuses.some(function(status) {
          return status && adminTechnicalStatusNeedsAttention(status);
        });

        const currentWarning = document.getElementById("adminTechnicalWarning");
        if (currentWarning) {
          currentWarning.classList.toggle("show", hasProblem);
        }
      });
    })
    .withFailureHandler(function() {
      // Při chybě načtení necháme nabídku bez varovného trojúhelníku.
    })
    .getAdminVehicles();
}

function adminTechnicalStatusNeedsAttention(status) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  function dateNeedsAttention(value) {
    if (!value) return false;
    const d = new Date(value);
    if (isNaN(d.getTime())) return false;
    d.setHours(0, 0, 0, 0);
    const diff = Math.ceil((d - today) / 86400000);
    return diff <= 30;
  }

  function kmNeedsAttention(last, next) {
    if (!next || !last) return false;
    const remaining = Number(next) - Number(last);
    return !isNaN(remaining) && remaining <= 4000;
  }

  return dateNeedsAttention(status.vignetteUntil) ||
         dateNeedsAttention(status.stkUntil) ||
         kmNeedsAttention(status.currentKm, status.oilNextKm) ||
         dateNeedsAttention(status.serviceNext);
}

function renderAdminTechnicalStatus(vehicles) {
  const container = document.getElementById("adminTechnicalList");
  if (!container) return;

  if (!Array.isArray(vehicles) || vehicles.length === 0) {
    container.innerHTML = `
      <div class="empty-card">
        🚐 Žádná vozidla
      </div>
    `;
    return;
  }

  const requests = vehicles.map(function(vehicle, index) {
    return new Promise(function(resolve) {
      google.script.run
        .withSuccessHandler(function(status) {
          resolve({ vehicle: vehicle, status: status, index: index });
        })
        .withFailureHandler(function(error) {
          resolve({ vehicle: vehicle, status: null, error: error, index: index });
        })
        .getTechnicalStatus(vehicle.name);
    });
  });

  Promise.all(requests).then(function(results) {
    let html = `
      <div class="admin-technical-list">
    `;

    results.forEach(function(result) {
      const vehicle = result.vehicle;
      const status = result.status;

      if (!status) {
        html += `
          <div class="form-card admin-technical-vehicle-card">
            <div class="admin-technical-vehicle-head">
              <div class="admin-technical-vehicle-icon">🚐</div>
              <div class="admin-technical-vehicle-info">
                <div class="admin-technical-vehicle-name">${vehicle.name || "Vozidlo"}</div>
                <div class="admin-technical-vehicle-sub">Technický stav nelze načíst</div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      function dateState(value) {
        if (!value) return { cls: "status-gray", text: "Neuvedeno", icon: "⚪" };
        const d = new Date(value);
        d.setHours(0, 0, 0, 0);
        const diff = Math.ceil((d - today) / 86400000);
        if (diff < 0) return { cls: "status-red", text: "Po termínu", icon: "🔴" };
        if (diff <= 30) return { cls: "status-orange", text: "Blíží se termín", icon: "🟠" };
        return { cls: "status-green", text: "V pořádku", icon: "🟢" };
      }

      function kmState(last, next) {
        if (!next || !last) return { cls: "status-gray", text: "Neuvedeno", icon: "⚪" };
        const remaining = Number(next) - Number(last);
        if (remaining < 0) return { cls: "status-red", text: "Po termínu", icon: "🔴" };
        if (remaining <= 4000) return { cls: "status-orange", text: "Blíží se výměna", icon: "🟠" };
        return { cls: "status-green", text: "V pořádku", icon: "🟢" };
      }

      const vignette = dateState(status.vignetteUntil);
      const stk = dateState(status.stkUntil);
      const oil = kmState(status.currentKm, status.oilNextKm);
      const service = dateState(status.serviceNext);

      const states = [vignette, stk, oil, service];
      const hasRed = states.some(function(x) { return x.cls === "status-red"; });
      const hasOrange = states.some(function(x) { return x.cls === "status-orange"; });
      const overallClass = hasRed ? "status-red" : (hasOrange ? "status-orange" : "status-green");
      const overallText = hasRed ? "Vyžaduje pozornost" : (hasOrange ? "Blíží se termín" : "V pořádku");
      const overallIcon = hasRed ? "🔴" : (hasOrange ? "🟠" : "🟢");

      html += `
        <div class="form-card admin-technical-vehicle-card">
          <div class="admin-technical-vehicle-head">
            <div class="admin-technical-vehicle-icon">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M12 34l4-15c.7-2.5 2.9-4 5.5-4h13c2.6 0 4.8 1.5 5.5 4l4 15v8H12z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
                <path d="M17 27h22M18 35h4M34 35h4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="19" cy="42" r="3.5" fill="currentColor"/><circle cx="37" cy="42" r="3.5" fill="currentColor"/>
              </svg>
            </div>
            <div class="admin-technical-vehicle-info">
              <div class="admin-technical-vehicle-name">${vehicle.name || "Vozidlo"}</div>
              <div class="admin-technical-vehicle-sub">Aktuální stav: ${status.currentKm ? formatNumber(status.currentKm) + " km" : "Neuvedeno"}</div>
            </div>
            <div class="admin-technical-overall ${overallClass}">${overallIcon}</div>
          </div>

          <div class="admin-technical-items">
            <div class="admin-technical-item ${vignette.cls}"><span class="admin-tech-item-icon">🛣️</span><div><strong>Dálniční známka</strong><small>${formatTechnicalDate(status.vignetteUntil)}</small></div><b>${vignette.text}</b></div>
            <div class="admin-technical-item ${stk.cls}"><span class="admin-tech-item-icon">📋</span><div><strong>STK</strong><small>${formatTechnicalDate(status.stkUntil)}</small></div><b>${stk.text}</b></div>
            <div class="admin-technical-item ${oil.cls}"><span class="admin-tech-item-icon">🛢️</span><div><strong>Výměna oleje</strong><small>${status.oilNextKm ? formatNumber(status.oilNextKm) + " km" : "Neuvedeno"}</small></div><b>${oil.text}</b></div>
            <div class="admin-technical-item ${service.cls}"><span class="admin-tech-item-icon">🛠️</span><div><strong>Servis</strong><small>${formatTechnicalDate(status.serviceNext)}</small></div><b>${service.text}</b></div>
            <div class="admin-technical-item status-gray"><span class="admin-tech-item-icon">🚗</span><div><strong>Pneumatiky</strong><small>${status.tires || "Neuvedeno"}</small></div></div>
            <div class="admin-technical-item status-gray"><span class="admin-tech-item-icon">🔑</span><div><strong>VIN</strong><small>${status.vin || "Neuvedeno"}</small></div></div>
          </div>
        </div>
      `;
    });

    html += `</div>`;
    container.innerHTML = html;
  });
}

function getAdminServicePhotoUrl(value) {
  const text = String(value || "").trim();
  if (!text) return "";

  const markdownMatch = text.match(/\((https?:\/\/[^)]+)\)/);
  if (markdownMatch) return markdownMatch[1];

  if (/^https?:\/\//i.test(text)) return text;
  return "";
}

      alert("Stav hlášení se nepodařilo změnit:\n\n" + (error && error.message ? error.message : error));

  const reports = window.adminServiceReports;
  const report = reports && reports[index];
  if (!report) return;

  if ((report.status || "") !== "Vyřešeno") {
    alert("Smazat lze pouze vyřešené hlášení.");
    return;
  }

  if (!confirm("Opravdu chcete toto vyřešené hlášení smazat?")) return;

  google.script.run
    .withSuccessHandler(function() {
      showAdminServiceReports();
    })
    .withFailureHandler(function(error) {
      alert("Hlášení se nepodařilo smazat:\n\n" + (error && error.message ? error.message : error));
    })
    .deleteServiceReport(report.row);
}

    oilNextKm:
      document.getElementById("adminVehicleOilNext").value,

    serviceLast:

    serviceNext:
      document.getElementById("adminVehicleServiceNext").value,

    tires:
      document.getElementById("adminVehicleTires").value.trim()
  };

  message.innerHTML = `
    <span style="color:#666;">
      ⏳ Ukládám...
    </span>

    .withSuccessHandler(function() {

      message.innerHTML = `
        <span style="color:#2e7d32;">

      message.innerHTML = `
        <span style="color:#d32f2f;">
          ❌ ${error.message}
        </span>
      `;

    })

    .updateAdminVehicle(data);
}

          formatNumber(lastKm) + " km";

      }


      const endKmInput =
        document.getElementById("endKm");

      const distance =
        document.getElementById("distance");

      function updateDistance() {

        if (!distance || !endKmInput) return;

        const rawValue =
          endKmInput.value.trim();

        if (rawValue === "") {
          distance.textContent =
            "Zadejte konečný stav km";
          distance.style.color =
            "#64748b";
          return;
        }

        const endKm =
          Number(rawValue);

        if (!Number.isFinite(endKm) || endKm < 0) {
          distance.textContent =
            "⚠️ Zkontrolujte zadaný stav km";
          distance.style.color =
            "#dc2626";
          return;
        }

        const difference =
          endKm - Number(lastKm);

        if (difference < 0) {
          distance.textContent =
            "⚠️ Jízda je v mínusu: " +
            formatNumber(Math.abs(difference)) + " km";
          distance.style.color =
            "#dc2626";
          return;
        }

        if (difference > 5000) {
          distance.textContent =
            "⚠️ Neobvykle vysoký nájezd: " +
            formatNumber(difference) + " km";
          distance.style.color =
            "#dc2626";
          return;
        }

        distance.textContent =
          "Ujeto: " + formatNumber(difference) + " km";
        distance.style.color =
          "#16a34a";
      }

      endKmInput.addEventListener(
        "input",
        updateDistance
      );

      endKmInput.addEventListener(
        "change",
        updateDistance
      );

      updateDistance();


    })

    .withFailureHandler(function(error) {

      const lastKmElement =
        document.getElementById("lastKm");


      if (lastKmElement) {

        lastKmElement.textContent =
          "Nelze načíst";

      }


      console.error(
        "Chyba getLastMileage:",
        error
      );

      alert(
        "Chyba při načítání posledního stavu KM:\n\n" +
        error.message
      );

    })

    .getLastMileage(vehicleName);

}

function submitServiceReport(vehicleName) {
  const problemInput = document.getElementById("serviceProblem");
  const photoInput = document.getElementById("servicePhoto");
  const message = document.getElementById("serviceMessage");

  const problem = problemInput ? problemInput.value.trim() : "";
  const driverInput = document.getElementById("serviceDriver");
  const driver = driverInput ? driverInput.value.trim() : "";

  if (!driver) {
    alert("Napište prosím své jméno.");
    if (driverInput) driverInput.focus();
    return;
  }

  if (!problem) {
    alert("Popište prosím problém na vozidle.");
    return;
  }

  const button = document.querySelector('.save-button[onclick*="submitServiceReport"]');

  if (button) {
    button.disabled = true;
    button.textContent = "⏳ ODESÍLÁM...";
  }

  if (message) {
    message.textContent = "Odesílám hlášení...";
  }

  function sendReport(photoData) {
    const data = {
      vehicleName: vehicleName,
      driver: driver,
      problem: problem,
      photo: photoData || null
    };

    google.script.run
      .withSuccessHandler(function(result) {
        if (button) {
          button.textContent = "✅ ODESLÁNO";
        }

        if (message) {
          message.textContent = "Hlášení bylo úspěšně odesláno.";
        }

        setTimeout(function() {
          showVehicle(vehicleName);
        }, 800);
      })
      .withFailureHandler(function(error) {
        if (button) {
          button.disabled = false;
          button.textContent = "🛠️ ODESLAT HLÁŠENÍ";
        }

        if (message) {
          message.textContent = "";
        }

        alert(
          "Chyba při odesílání hlášení:\n\n" +
          (error && error.message ? error.message : error)
        );

        console.error("Chyba servisního hlášení:", error);
      })
      .saveServiceReport(data);
  }

  // Bez fotografie odešleme hlášení rovnou.
  if (!photoInput || !photoInput.files || photoInput.files.length === 0) {
    sendReport(null);
    return;
  }

  // S fotografií ji nejdříve převedeme na Base64 a následně odešleme.
  const file = photoInput.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    const result = event.target.result || "";
    const comma = result.indexOf(",");

    if (comma < 0) {
      if (button) {
        button.disabled = false;
        button.textContent = "🛠️ ODESLAT HLÁŠENÍ";
      }
      if (message) message.textContent = "";
      alert("Fotografii se nepodařilo připravit k odeslání.");
      return;
    }

    sendReport({
      name: file.name,
      type: file.type || "image/jpeg",
      data: result.substring(comma + 1)
    });
  };

  reader.onerror = function() {
    if (button) {
      button.disabled = false;
      button.textContent = "🛠️ ODESLAT HLÁŠENÍ";
    }
    if (message) message.textContent = "";
    alert("Nepodařilo se načíst fotografii.");
  };

  reader.readAsDataURL(file);
}

function renderTechnicalStatus(data) {
  const container = document.getElementById("technicalStatus");

  // =========================
  // POMOCNÉ FUNKCE
  // =========================

  function getDateStatus(dateValue) {
    if (!dateValue) {
      return {
        className: "status-gray",
        icon: "⚪",
        text: "Neuvedeno"
      };
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const date = new Date(dateValue);
    date.setHours(0, 0, 0, 0);

    const difference =
      Math.ceil((date - today) / (1000 * 60 * 60 * 24));

    if (difference < 0) {
      return {
        className: "status-red",
        icon: "🔴",
        text: "Po termínu"
      };
    }

    if (difference <= 30) {
      return {
        className: "status-orange",
        icon: "🟠",
        text: "Blíží se termín"
      };
    }

    return {
      className: "status-green",
      icon: "🟢",
      text: "V pořádku"
    };
  }


  function getOilStatus(currentKm, nextKm) {
    if (!nextKm || !currentKm) {
      return {
        className: "status-gray",
        icon: "⚪",
        text: "Neuvedeno"
      };
    }

    const remaining =
      Number(nextKm) - Number(currentKm);

    if (remaining < 0) {
      return {
        className: "status-red",
        icon: "🔴",
        text: "Po termínu",
        remaining: remaining
      };
    }

    if (remaining <= 4000) {
      return {
        className: "status-orange",
        icon: "🟠",
        text: "Blíží se výměna",
        remaining: remaining
      };
    }

    return {
      className: "status-green",
      icon: "🟢",
      text: "V pořádku",
      remaining: remaining
    };
  }


  // =========================
  // DÁLNIČNÍ ZNÁMKA
  // =========================

  const vignetteStatus =
    getDateStatus(data.vignetteUntil);


  // =========================
  // STK
  // =========================

  const stkStatus =
    getDateStatus(data.stkUntil);


  // =========================
  // OLEJ
  // =========================

  const currentKm =
    data.currentKm || 0;

  const oilStatus =
    getOilStatus(
      currentKm,
      data.oilNextKm
    );


  // =========================
  // SERVIS
  // =========================

  const serviceStatus =
    getDateStatus(data.serviceNext);


  // =========================
  // VYKRESLENÍ
  // =========================

  container.innerHTML = `

    <div class="technical-card ${vignetteStatus.className}">

      <div class="technical-icon">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <path d="M16 8h24L33 48H23z" fill="currentColor"/>
          <path d="M27 11h3v8h-3zM26.5 24h3v8h-3zM26 37h3v8h-3z" fill="white"/>
        </svg>
      </div>

      <div class="technical-info">

        <div class="technical-title">
          Dálniční známka
        </div>

        <div class="technical-value">
          ${formatTechnicalDate(data.vignetteUntil)}
        </div>

        <div class="technical-status">
          ${vignetteStatus.icon}
          ${vignetteStatus.text}
        </div>

      </div>

    </div>


    <div class="technical-card ${stkStatus.className}">

      <div class="technical-icon">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <rect x="12" y="10" width="32" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="4"/>
          <rect x="21" y="7" width="14" height="7" rx="3" fill="currentColor"/>
          <path d="M19 24h18M19 32h18M19 40h12" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="technical-info">

        <div class="technical-title">
          STK
        </div>

        <div class="technical-value">
          ${formatTechnicalDate(data.stkUntil)}
        </div>

        <div class="technical-status">
          ${stkStatus.icon}
          ${stkStatus.text}
        </div>

      </div>

    </div>


    <div class="technical-card ${oilStatus.className}">

      <div class="technical-icon">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <path d="M18 10h20v37H18z" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M22 15h12v10H22z" fill="currentColor"/>
          <path d="M38 19h4c4 0 6 3 6 7v10c0 3 2 4 4 4v3c-5 0-8-2-8-7V27c0-2-1-3-3-3h-3z" fill="currentColor"/>
        </svg>
      </div>

      <div class="technical-info">

        <div class="technical-title">
          Výměna oleje
        </div>

        <div class="technical-value">
          ${data.oilNextKm
            ? formatNumber(data.oilNextKm) + " km"
            : "Neuvedeno"}
        </div>

        <div class="technical-sub">
          Poslední výměna:
          ${data.oilLastKm
            ? formatNumber(data.oilLastKm) + " km"
            : "Neuvedeno"}
        </div>

        <div class="technical-status">
          ${oilStatus.icon}
          ${oilStatus.text}
          ${
            oilStatus.remaining !== undefined
              ? oilStatus.remaining >= 0
                ? " • zbývá " +
                  formatNumber(oilStatus.remaining) +
                  " km"
                : " • překročeno o " +
                  formatNumber(Math.abs(oilStatus.remaining)) +
                  " km"
              : ""
          }
        </div>

      </div>

    </div>


    <div class="technical-card ${serviceStatus.className}">

      <div class="technical-icon">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <path d="M35 10a11 11 0 0 0 1 14L20 40a5 5 0 1 0 7 7l16-16a11 11 0 0 0 3-12l-8 8-6-2-2-6 8-9a11 11 0 0 0-3-0Z" fill="currentColor"/>
          <circle cx="23" cy="42" r="4" fill="white"/>
        </svg>
      </div>

      <div class="technical-info">

        <div class="technical-title">
          Servis
        </div>

        <div class="technical-value">
          ${formatTechnicalDate(data.serviceNext)}
        </div>

        <div class="technical-sub">
          Poslední servis:
          ${formatTechnicalDate(data.serviceLast)}
        </div>

        <div class="technical-status">
          ${serviceStatus.icon}
          ${serviceStatus.text}
        </div>

      </div>

    </div>


    <div class="technical-card">

      <div class="technical-icon">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="17" fill="none" stroke="currentColor" stroke-width="5"/>
          <circle cx="28" cy="28" r="6" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M28 11v11M28 34v11M11 28h11M34 28h11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="technical-info">

        <div class="technical-title">
          Pneumatiky
        </div>

        <div class="technical-value">
          ${data.tires || "Neuvedeno"}
        </div>

      </div>

    </div>

  `;
}

function formatTechnicalDate(value) {
  if (!value) return "Neuvedeno";

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString("cs-CZ");
}

function formatNumber(number) {

  if (number === "" || number === null || number === undefined) {
    return "";
  }

  return Number(number).toLocaleString("cs-CZ");

}


function getShortMonth(monthIndex) {

  const months = [
    "LED",

    "ČVN",
    "ČVC",
    "SRP",
    "ZÁŘ",
    "ŘÍJ",
    "LIS",
    "PRO"
  ];

  return months[monthIndex];

}

});

<script id="admin-panel-modern-hook">
(function(){
  function markAdminPanel(){
    const screen = document.getElementById("screen");
    if(!screen) return;

    const text = screen.textContent || "";
    if(!text.includes("Administrátor")) return;

    const cards = screen.querySelectorAll(".form-card");
    if(!cards.length) return;

    let first = cards[0];
    let wrapper = first.closest(".admin-panel-modern");

    if(!wrapper){
      wrapper = document.createElement("div");
      wrapper.className = "admin-panel-modern";
      first.parentNode.insertBefore(wrapper, first);
      cards.forEach(function(card){ wrapper.appendChild(card); });
    }
  }

  document.addEventListener("DOMContentLoaded", markAdminPanel);
  new MutationObserver(function(){ setTimeout(markAdminPanel, 0); })
    .observe(document.body, {childList:true, subtree:true});
})();
</script>
