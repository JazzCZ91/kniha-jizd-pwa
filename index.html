<script>
(function(){

  /*
   * GitHub Pages -> Google Apps Script API
   *
   * GitHub Pages neumí google.script.run.
   * Proto je komunikace vedena přes URL Apps Scriptu.
   */

  const API_URL =
    window.KNIHA_JIZD_API_URL ||
    "https://script.google.com/macros/s/AKfycbxDEb7OYtzF1w3NoyXCG0mQTIY8uT_5o63MxQI1MoQPJ0YB82UgqgFG8r1s3A7MsXhd/exec";


  /*
   * Komunikační vrstva.
   * Zachovává stejné názvy metod jako původní google.script.run,
   * aby zbytek aplikace nemusel být celý přepisován.
   */

  window.knihaApi = {

    run: {

      _success: null,
      _failure: null,

      withSuccessHandler: function(fn){
        this._success = fn;
        return this;
      },

      withFailureHandler: function(fn){
        this._failure = fn;
        return this;
      }

    }

  };


  const apiMethods = [
    "getVehicles",
    "getVehicle",
    "getTripsForVehicle",
    "getLastMileage",
    "saveNewTrip",
    "getVehicleInfo",
    "getTechnicalStatus",
    "checkAdminPassword",
    "setAdminPassword",
    "getAdminVehicles",
    "updateAdminVehicle",
    "getFuelCards",
    "syncFuelCardsFromVehicles",
    "saveFuelCard",
    "deactivateFuelCard",
    "activateFuelCard",
    "getServiceSheet",
    "getAdminServiceReports",
    "saveServiceReport",
    "authorizeDrive",
    "updateServiceReportStatus",
    "getAdminTrips",
    "deleteServiceReport"
  ];


  apiMethods.forEach(function(method){

    window.knihaApi.run[method] = function(){

      const args =
        Array.prototype.slice.call(arguments);

      const success =
        window.knihaApi.run._success;

      const failure =
        window.knihaApi.run._failure;

      window.knihaApi.run._success = null;
      window.knihaApi.run._failure = null;

      callApi(
        method,
        args,
        success,
        failure
      );

      return window.knihaApi.run;

    };

  });


  function callApi(
    method,
    args,
    success,
    failure
  ){

    const callbackName =
      "knihaCallback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2);

    const script =
      document.createElement("script");

    const payload = {
      method: method,
      args: args,
      callback: callbackName
    };

    window[callbackName] =
      function(response){

        try{

          if (
            response &&
            response.success === false
          ){

            if(failure){
              failure({
                message:
                  response.error ||
                  "Neznámá chyba."
              });
            }

            return;

          }

          if(success){
            success(
              response &&
              response.data !== undefined
                ? response.data
                : response
            );
          }

        }finally{

          delete window[callbackName];

          if(script.parentNode){
            script.parentNode.removeChild(script);
          }

        }

      };


    script.onerror =
      function(){

        delete window[callbackName];

        if(script.parentNode){
          script.parentNode.removeChild(script);
        }

        if(failure){

          failure({
            message:
              "Nepodařilo se spojit s Google Apps Script."
          });

        }

      };


    script.src =
      API_URL +
      "?api=1" +
      "&method=" +
      encodeURIComponent(method) +
      "&args=" +
      encodeURIComponent(
        JSON.stringify(args)
      ) +
      "&callback=" +
      encodeURIComponent(callbackName);

    document.body.appendChild(script);

  }


  /*
   * Původní google.script.run není na GitHub Pages dostupné.
   * Některé starší části aplikace ho ale mohou ještě kontrolovat.
   */

  if(typeof window.google === "undefined"){
    window.google = {};
  }

  if(!window.google.script){
    window.google.script = {};
  }

  window.google.script.run =
    window.knihaApi.run;


})();
</script>


<script>

let vehicles = [];
let selectedVehicle = null;
let currentTrips = [];
let currentTechnical = null;
let adminAuthenticated = false;


function showVehicleList(){

  const screen =
    document.getElementById("screen");

  screen.innerHTML = `
    <div class="home-screen">

      <div class="home-header">

        <div class="home-header-title">
          Kniha jízd
        </div>

        <div class="home-header-subtitle">
          Vyberte vozidlo
        </div>

        <button
          class="admin-button"
          onclick="showAdminLogin()">
          ⚙️ Administrátor
        </button>

      </div>

      <div class="home-content">

        <div class="home-section-title">
          Vozidla
        </div>

        <div id="vehicleList">
          <div class="loading">
            Načítám vozidla…
          </div>
        </div>

      </div>

    </div>
  `;


  knihaApi.run
    .withSuccessHandler(function(data){

      vehicles =
        Array.isArray(data)
          ? data
          : [];

      renderVehicleList();

    })
    .withFailureHandler(function(error){

      screen.querySelector("#vehicleList").innerHTML =
        `
          <div class="empty-card">
            Nepodařilo se načíst vozidla.<br>
            ${escapeHtml(
              error && error.message
                ? error.message
                : "Neznámá chyba."
            )}
          </div>
        `;

    })
    .getVehicles();

}



function renderVehicleList(){

  const container =
    document.getElementById("vehicleList");

  if(!container){
    return;
  }

  if(!vehicles.length){

    container.innerHTML =
      `
        <div class="empty-card">
          Nebyla nalezena žádná aktivní vozidla.
        </div>
      `;

    return;

  }


  container.innerHTML =
    vehicles.map(function(vehicle){

      const warning =
        getVehicleWarning(vehicle);

      return `

        <div
          class="vehicle-card"
          onclick="openVehicle('${escapeAttr(vehicle.name)}')">

          <div class="vehicle-photo">

            ${
              vehicle.image
                ? `
                  <img
                    src="${escapeAttr(vehicle.image)}"
                    alt="">
                `
                : `
                  <div
                    style="
                      font-size:72px;
                      opacity:.72;
                    ">
                    🚚
                  </div>
                `
            }

          </div>


          <div>

            <div class="vehicle-name">
              ${escapeHtml(vehicle.name)}
            </div>

            <div class="vehicle-km-label">
              Stav tachometru
            </div>

            <div
              class="vehicle-km"
              id="km-${cssSafe(vehicle.name)}">

              Načítám…

            </div>

          </div>


          ${
            warning
              ? `
                <div class="vehicle-warning">
                  ${warning}
                </div>
              `
              : ""
          }

        </div>

      `;

    }).join("");


  vehicles.forEach(function(vehicle){

    loadVehicleKm(vehicle);

  });

}



function loadVehicleKm(vehicle){

  const id =
    "km-" +
    cssSafe(vehicle.name);

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  knihaApi.run
    .withSuccessHandler(function(km){

      element.textContent =
        km
          ? formatNumber(km) + " km"
          : "Neuvedeno";

    })
    .withFailureHandler(function(){

      element.textContent =
        "Neuvedeno";

    })
    .getLastMileage(
      vehicle.name
    );

}



function getVehicleWarning(vehicle){

  const today =
    new Date();

  const warnings = [];

  if(vehicle.stkUntil){

    const stk =
      new Date(vehicle.stkUntil);

    const days =
      Math.ceil(
        (stk - today) /
        86400000
      );

    if(days < 0){
      warnings.push("🔴");
    }else if(days <= 30){
      warnings.push("🟠");
    }

  }


  if(vehicle.vignetteUntil){

    const vignette =
      new Date(vehicle.vignetteUntil);

    const days =
      Math.ceil(
        (vignette - today) /
        86400000
      );

    if(days < 0){
      warnings.push("🔴");
    }else if(days <= 30){
      warnings.push("🟠");
    }

  }

  return warnings[0] || "";

}



function openVehicle(name){

  selectedVehicle =
    getVehicleLocal(name);

  if(!selectedVehicle){
    return;
  }

  showVehicleHome();

}



function getVehicleLocal(name){

  return vehicles.find(function(v){

    return String(v.name).trim() ===
      String(name).trim();

  }) || null;

}



function showVehicleHome(){

  const vehicle =
    selectedVehicle;

  const screen =
    document.getElementById("screen");

  screen.innerHTML = `

    <div class="content">

      <div class="top-bar">

        <button
          class="back-button"
          onclick="showVehicleList()">
          ‹
        </button>

        <div class="title">
          ${escapeHtml(vehicle.name)}
        </div>

      </div>


      <div class="vehicle-header">

        <div class="vehicle-icon-large">
          🚚
        </div>

        <div>

          <div class="vehicle-title">
            ${escapeHtml(vehicle.name)}
          </div>

          <div
            style="
              color:#718096;
              font-size:12px;
              margin-top:3px;
            ">
            Kniha jízd
          </div>

        </div>

      </div>


      <div id="vehicleHomeContent">

        <div class="loading">
          Načítám údaje…
        </div>

      </div>

    </div>

  `;


  knihaApi.run
    .withSuccessHandler(function(data){

      currentTechnical =
        data || {};

      renderVehicleHome(data);

    })
    .withFailureHandler(function(error){

      document.getElementById(
        "vehicleHomeContent"
      ).innerHTML =
        `
          <div class="empty-card">
            Nepodařilo se načíst údaje vozidla.<br>
            ${escapeHtml(
              error && error.message
                ? error.message
                : "Neznámá chyba."
            )}
          </div>
        `;

    })
    .getTechnicalStatus(
      vehicle.name
    );

}



function renderVehicleHome(data){

  const container =
    document.getElementById(
      "vehicleHomeContent"
    );

  if(!container){
    return;
  }

  const currentKm =
    data.currentKm || 0;

  container.innerHTML = `

    <div class="last-km">

      Aktuální stav tachometru

      <strong>
        ${
          currentKm
            ? formatNumber(currentKm) + " km"
            : "Neuvedeno"
        }
      </strong>

    </div>


    <button
      class="new-trip-button"
      onclick="showNewTrip()">

      ➕ Nová jízda

    </button>


    <button
      class="new-trip-button"
      onclick="showTrips()">

      📖 Kniha jízd

    </button>


    <button
      class="new-trip-button"
      onclick="showTechnicalStatus()">

      🔧 Technický stav

    </button>

  `;

}



function showNewTrip(){

  const vehicle =
    selectedVehicle;

  const screen =
    document.getElementById("screen");

  screen.innerHTML = `

function updateDistance(){

  const start =
    Number(
      document.getElementById(
        "tripStartKm"
      ).value
    );

  const end =
    Number(
      document.getElementById(
        "tripEndKm"
      ).value
    );

  const element =
    document.getElementById(
      "tripDistance"
    );

  if(
    !isNaN(start) &&
    !isNaN(end) &&
    end >= start
  ){

    element.textContent =
      "Ujeto: " +
      formatNumber(end - start) +
      " km";

  }else{

    element.textContent = "";

  }

}

function renderTechnicalStatus(data){

  const container =
    document.getElementById(
      "technicalStatus"
    );

  if(!container){
    return;
  }


  function getDateStatus(value){

    if(!value){

      return {
        className:"status-gray",
        icon:"⚪",
        text:"Neuvedeno"
      };

    }

    const date =
      new Date(value);

    if(isNaN(date.getTime())){

      return {
        className:"status-gray",
        icon:"⚪",
        text:"Neuvedeno"
      };

    }

    const today =
      new Date();

    today.setHours(0,0,0,0);

    date.setHours(0,0,0,0);

    const difference =
      Math.ceil(
        (date - today) /
        86400000
      );

    if(difference < 0){

      return {
        className:"status-red",
        icon:"🔴",
        text:"Po termínu"
      };

    }

    if(difference <= 30){

      return {
        className:"status-orange",
        icon:"🟠",
        text:"Blíží se termín"
      };

    }

    return {
      className:"status-green",
      icon:"🟢",
      text:"V pořádku"
    };

    currentKm,
    nextKm

        icon:"⚪",
        text:"Neuvedeno"
      };

    const remaining =
      Number(nextKm) -

    if(remaining < 0){

      return {
        className:"status-red",
        icon:"🔴",
        text:"Po termínu",
        remaining:remaining
      };

    if(remaining <= 4000){

        icon:"🟠",
        text:"Blíží se výměna",
        remaining:remaining
      };

    return {

      icon:"🟢",
      text:"V pořádku",
      remaining:remaining
    };

    );

      <div class="technical-info">

        </div>

        <div class="technical-value">
          ${formatTechnicalDate(
            data.vignetteUntil
          )}
        </div>

        <div class="technical-status">
          ${vignetteStatus.icon}
          ${vignetteStatus.text}
        </div>

      </div>

    </div>


    <div
      class="technical-card
      ${stkStatus.className}">

      <div class="technical-icon">

        <svg
          viewBox="0 0 56 56"
          aria-hidden="true">

          <rect
            x="12"
            y="10"
            width="32"
            height="38"
            rx="5"
            fill="none"
            stroke="currentColor"
            stroke-width="4"/>

          <rect
            x="21"
            y="7"
            width="14"
            height="7"
            rx="3"
            fill="currentColor"/>

          <path
            d="M19 24h18M19 32h18M19 40h12"
            stroke="currentColor"
            stroke-width="3.5"
            stroke-linecap="round"/>

        </svg>

      </div>


      <div class="technical-info">

        <div class="technical-title">
          STK
        </div>

        <div class="technical-value">
          ${formatTechnicalDate(
            data.stkUntil
          )}
        </div>

        <div class="technical-status">
          ${stkStatus.icon}
          ${stkStatus.text}
        </div>

      </div>

    </div>


    <div
      class="technical-card
      ${oilStatus.className}">

      <div class="technical-icon">

        <svg
          viewBox="0 0 56 56"
          aria-hidden="true">

          <path
            d="M18 10h20v37H18z"
            fill="none"
            stroke="currentColor"
            stroke-width="4"/>

          <path
            d="M22 15h12v10H22z"
            fill="currentColor"/>

          <path
            d="M38 19h4c4 0 6 3 6 7v10c0 3 2 4 4 4v3c-5 0-8-2-8-7V27c0-2-1-3-3-3h-3z"
            fill="currentColor"/>

        </svg>

      </div>


      <div class="technical-info">

        <div class="technical-title">

        </div>

        <div class="technical-value">

function formatTechnicalDate(value){

  if(!value){
    return "Neuvedeno";
  }

  const date =
    new Date(value);

  if(isNaN(date.getTime())){
    return value;
  }

  return date.toLocaleDateString(
    "cs-CZ"
  );

}



function formatNumber(number){

  if(
    number === "" ||
    number === null ||
    number === undefined
  ){
    return "";
  }

  return Number(number).toLocaleString(
    "cs-CZ"
  );

}



function getShortMonth(monthIndex){

  const months = [
    "LED",
    "ÚNO",
    "BŘE",
    "DUB",
    "KVĚ",
    "ČVN",
    "ČVC",
    "SRP",
    "ZÁŘ",
    "ŘÍJ",
    "LIS",
    "PRO"
  ];

  return months[monthIndex];

}



function parseTripDate(value){

  if(!value){
    return null;
  }

  if(value instanceof Date){
    return value;
  }

  const text =
    String(value);

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ){

    const parts =
      text.split("-");

    return new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

  }

  const date =
    new Date(text);

  return isNaN(date.getTime())
    ? null
    : date;

}



function formatDisplayDate(value){

  const date =
    parseTripDate(value);

  if(!date){
    return String(value || "");
  }

  return date.toLocaleDateString(
    "cs-CZ"
  );

}



function todayString(){

  const date =
    new Date();

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}



function escapeHtml(value){

  return String(
    value === undefined ||
    value === null
      ? ""
      : value
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



function escapeAttr(value){

  return escapeHtml(value);

}



function cssSafe(value){

  return String(value || "")
    .replace(/[^a-zA-Z0-9_-]/g,"_");

}

        </strong>

      </div>


      <div class="detail-row">

        <span>
          PHM
        </span>

        <strong>
          ${
            trip.phm
              ? formatNumber(
                  trip.phm
                ) + " l"
              : "-"
          }
        </strong>

      </div>


      ${
        trip.note
          ? `
            <div
              class="detail-note"
              style="margin-top:10px">

              ${escapeHtml(
                trip.note
              )}

            </div>
          `
          : ""
      }

    `;

    container.appendChild(card);

  });

}



function showAdminServiceReports(){

  const screen =
    document.getElementById("screen");

  screen.innerHTML = `

    <div class="content">

      <div class="top-bar">

        <button
          class="back-button"
          onclick="showAdminPanel()">
          ‹
        </button>

        <div class="title">
          Servisní hlášení
        </div>

      </div>


      <div id="serviceReports">

        <div class="loading">
          Načítám hlášení…
        </div>

      </div>

    </div>

  `;


  knihaApi.run
    .withSuccessHandler(function(reports){

      renderServiceReports(
        reports || []
      );

    })
    .withFailureHandler(function(error){

      document.getElementById(
        "serviceReports"
      ).innerHTML =
        `
          <div class="empty-card">
            ${escapeHtml(
              error && error.message
                ? error.message
                : "Chyba."
            )}
          </div>
        `;

    })
    .getAdminServiceReports();

}



function renderServiceReports(reports){

  const container =
    document.getElementById(
      "serviceReports"
    );

  if(!container){
    return;
  }

  if(!reports.length){

    container.innerHTML =
      `
        <div class="empty-card">
          Žádná servisní hlášení.
        </div>
      `;

    return;

  }


  container.innerHTML =
    reports.map(function(report){

      return `

        <div class="form-card">

          <div
            style="
              display:flex;
              justify-content:space-between;
              gap:10px;
              align-items:flex-start;
              margin-bottom:9px;
            ">

            <div>

              <div
                style="
                  font-size:16px;
                  font-weight:800;
                ">

                ${escapeHtml(
                  report.vehicle
                )}

              </div>

              <div
                style="
                  font-size:11px;
                  color:#718096;
                  margin-top:3px;
                ">

                ${escapeHtml(
                  report.date
                )}

              </div>

            </div>


            <div
              style="
                font-size:12px;
                font-weight:800;
              ">

              ${escapeHtml(
                report.status
              )}

            </div>

          </div>


          <div
            style="
              font-size:14px;
              line-height:1.5;
              margin-bottom:9px;
            ">

            ${escapeHtml(
              report.problem
            )}

          </div>


          <div
            style="
              font-size:12px;
              color:#718096;
              margin-bottom:10px;
            ">

            Řidič:
            ${escapeHtml(
              report.driver
            )}

          </div>


          ${
            report.photo
              ? `
                <div
                  style="
                    margin-bottom:12px;
                  ">

                  <a
                    href="${escapeAttr(
                      report.photo
                    )}"
                    target="_blank">

                    📷 Zobrazit fotku

                  </a>

                </div>
              `
              : ""
          }


          <select
            class="form-input"
            onchange="changeServiceStatus(${report.row}, this.value)">

            <option
              value="Nové"
              ${report.status === "Nové" ? "selected" : ""}>
              Nové
            </option>

            <option
              value="Řeší se"
              ${report.status === "Řeší se" ? "selected" : ""}>
              Řeší se
            </option>

            <option
              value="Vyřešeno"
              ${report.status === "Vyřešeno" ? "selected" : ""}>
              Vyřešeno
            </option>

          </select>


          ${
            report.status === "Vyřešeno"
              ? `
                <button
                  class="form-button"
                  style="
                    margin-top:9px;
                    background:#dc3545;
                  "
                  onclick="deleteServiceReport(${report.row})">

                  🗑️ Smazat

                </button>
              `
              : ""
          }

        </div>

      `;

    }).join("");

}



function changeServiceStatus(row,status){

  knihaApi.run
    .withSuccessHandler(
      showAdminServiceReports
    )
    .withFailureHandler(function(error){

      alert(
        error && error.message
          ? error.message
          : "Stav se nepodařilo změnit."
      );

    })
    .updateServiceReportStatus(
      row,
      status
    );

}



function deleteServiceReport(row){

  if(
    !confirm(
      "Opravdu smazat vyřešené hlášení?"
    )
  ){
    return;
  }

  knihaApi.run
    .withSuccessHandler(
      showAdminServiceReports
    )
    .withFailureHandler(function(error){

      alert(
        error && error.message
          ? error.message
          : "Hlášení se nepodařilo smazat."
      );

    })
    .deleteServiceReport(row);

}



function refreshServiceWarning(){

  if(
    !window.knihaApi ||
    !knihaApi.run
  ){
    return;
  }

  knihaApi.run
    .withSuccessHandler(function(reports){

      const element =
        document.getElementById(
          "serviceWarningMenu"
        );

      if(element){

        const hasNew =
          Array.isArray(reports) &&
          reports.some(function(report){

            return report.status === "Nové";

          });

        element.style.display =
          hasNew
            ? "inline"
            : "none";

      }

    })
    .withFailureHandler(function(){})
    .getAdminServiceReports();

}



document.addEventListener(
  "DOMContentLoaded",
  function(){

    showVehicleList();

  }
);


})();
</script>


<script id="service-photo-controls">
function openServiceCamera(){

  const input =
    document.getElementById(
      "servicePhoto"
    );

  if(!input){
    return;
  }

  input.setAttribute(
    "capture",
    "environment"
  );

  input.click();

  setTimeout(
    function(){

      input.removeAttribute(
        "capture"
      );

    },
    1000
  );

}


function openServiceGallery(){

  const input =
    document.getElementById(
      "servicePhoto"
    );

  if(!input){
    return;
  }

  input.removeAttribute(
    "capture"
  );

  input.click();

}


document.addEventListener(
  "change",
  function(e){

    if(
      e.target &&
      e.target.id ===
        "servicePhoto"
    ){

      const label =
        document.getElementById(
          "servicePhotoName"
        );

      if(
        label &&
        e.target.files &&
        e.target.files.length
      ){

        label.textContent =
          e.target.files[0].name;

      }

    }

  }
);
</script>


<script id="admin-login-modern-hook">
document.addEventListener(
  "DOMContentLoaded",
  function(){

    function markAdminLogin(){

      const selectors = [
        "#adminLogin",
        "#admin-login",
        ".admin-login",
        ".admin-login-card"
      ];

      selectors.forEach(
        function(sel){

          document
            .querySelectorAll(sel)
            .forEach(function(el){

              el.classList.add(
                "admin-login-modern"
              );

            });

        }
      );

    }

    markAdminLogin();

    const observer =
      new MutationObserver(
        markAdminLogin
      );

    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );

  }
);
</script>


<script id="admin-panel-modern-hook">
(function(){

  function markAdminPanel(){

    const screen =
      document.getElementById(
        "screen"
      );

    if(!screen){
      return;
    }

    const text =
      screen.textContent || "";

    if(
      !text.includes(
        "Administrátor"
      )
    ){
      return;
    }

    const cards =
      screen.querySelectorAll(
        ".form-card"
      );

    if(!cards.length){
      return;
    }

    let first =
      cards[0];

    let wrapper =
      first.closest(
        ".admin-panel-modern"
      );

    if(!wrapper){

      wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "admin-panel-modern";

      first.parentNode.insertBefore(
        wrapper,
        first
      );

      cards.forEach(
        function(card){
          wrapper.appendChild(card);
        }
      );

    }

  }


  document.addEventListener(
    "DOMContentLoaded",
    markAdminPanel
  );


  new MutationObserver(
    function(){

      setTimeout(
        markAdminPanel,
        0
      );

    }
  ).observe(
    document.body,
    {
      childList:true,
      subtree:true
    }
  );

})();
</script>
